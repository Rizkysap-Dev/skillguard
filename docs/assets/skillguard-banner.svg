<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .title { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; fill: #f4f4f5; text-transform: uppercase; }
    .sub { font-size: 10px; fill: #71717a; }
    .badge-text { font-size: 10px; font-weight: 600; }
    .flow-line { stroke: #3f3f46; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .solid-line { stroke: #3f3f46; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="220" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1" />

  <!-- Flow Arrows (Connecting Nodes) -->
  <path d="M 170 90 L 208 90" class="solid-line" marker-end="url(#arrow)" />
  <path d="M 360 90 L 398 90" class="solid-line" marker-end="url(#arrow)" />
  <path d="M 550 90 L 588 90" class="solid-line" marker-end="url(#arrow)" />
  <path d="M 740 70 L 778 70" class="solid-line" marker-end="url(#arrow)" />
  <path d="M 740 110 L 778 110" class="solid-line" marker-end="url(#arrow)" />

  <!-- Branch Down to Invalid -->
  <path d="M 285 125 L 285 160" class="solid-line" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#71717a" />
    </marker>
  </defs>

  <!-- Node 1: Input Fixture -->
  <g transform="translate(40, 55)">
    <rect width="130" height="70" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="14" y="26" class="mono title">01. Fixture</text>
    <text x="14" y="44" class="mono sub">*.skillguard.json</text>
    <text x="14" y="58" class="mono sub">declarative spec</text>
  </g>

  <!-- Node 2: Validation & Limits -->
  <g transform="translate(210, 55)">
    <rect width="150" height="70" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="14" y="26" class="mono title">02. Schema Guard</text>
    <text x="14" y="44" class="mono sub">AST depth &lt;= 12</text>
    <text x="14" y="58" class="mono sub">__proto__ blocked</text>
  </g>

  <!-- Node 3: Mock Dispatcher -->
  <g transform="translate(400, 55)">
    <rect width="150" height="70" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="14" y="26" class="mono title">03. Mock Dispatch</text>
    <text x="14" y="44" class="mono sub">result / throws</text>
    <text x="14" y="58" class="mono sub">0 network / 0 exec</text>
  </g>

  <!-- Node 4: Matcher & Redaction -->
  <g transform="translate(590, 55)">
    <rect width="150" height="70" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="14" y="26" class="mono title">04. Assertion</text>
    <text x="14" y="44" class="mono sub">exact / contains</text>
    <text x="14" y="58" class="mono sub">secret scrub</text>
  </g>

  <!-- Exit States (Right) -->
  <!-- Exit 0: PASS -->
  <g transform="translate(780, 55)">
    <rect width="140" height="30" rx="4" fill="#052e16" stroke="#166534" stroke-width="1" />
    <circle cx="16" cy="15" r="3.5" fill="#22c55e" />
    <text x="28" y="19" class="mono badge-text" fill="#4ade80">exit 0  PASS</text>
  </g>

  <!-- Exit 1: FAIL -->
  <g transform="translate(780, 95)">
    <rect width="140" height="30" rx="4" fill="#2a1215" stroke="#7f1d1d" stroke-width="1" />
    <circle cx="16" cy="15" r="3.5" fill="#ef4444" />
    <text x="28" y="19" class="mono badge-text" fill="#f87171">exit 1  FAIL</text>
  </g>

  <!-- Exit 2: INVALID (Below Schema Guard) -->
  <g transform="translate(210, 162)">
    <rect width="150" height="28" rx="4" fill="#2e1022" stroke="#701a75" stroke-width="1" />
    <circle cx="16" cy="14" r="3.5" fill="#d946ef" />
    <text x="28" y="18" class="mono badge-text" fill="#f0abfc">exit 2  INVALID</text>
  </g>

  <!-- Top-left subtle branding -->
  <text x="40" y="32" class="mono" font-size="11" font-weight="600" fill="#a1a1aa">SKILLGUARD PIPELINE SPEC</text>
  <text x="215" y="32" class="mono" font-size="10" fill="#52525b">|  DETERMINISTIC VERIFICATION (NO-LLM)</text>
</svg>
