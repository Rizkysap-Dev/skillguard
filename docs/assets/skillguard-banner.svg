<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glass & Card fills -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Left Accent Aura -->
  <circle cx="160" cy="180" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="680" cy="140" r="180" fill="#0284c7" opacity="0.08" filter="url(#glow)" />

  <!-- LEFT: Hero Branding -->
  <g transform="translate(60, 55)">
    <!-- Icon Shield + Terminal -->
    <g transform="translate(0, 15)">
      <!-- Shield Outer Glow -->
      <path d="M 45 4 L 84 20 C 84 58 64 96 45 110 C 26 96 6 58 6 20 Z" fill="url(#shield-grad)" opacity="0.25" filter="url(#glow)" />
      <!-- Shield Base -->
      <path d="M 45 4 L 84 20 C 84 58 64 96 45 110 C 26 96 6 58 6 20 Z" fill="#0b1329" stroke="url(#shield-grad)" stroke-width="2.5" />
      <!-- Inner Terminal Glyphs: >_ checkmark -->
      <path d="M 28 42 L 40 54 L 28 66" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 45 66 L 62 66" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
      <!-- Checkmark Badge on shield bottom -->
      <circle cx="65" cy="88" r="14" fill="#059669" />
      <path d="M 59 88 L 63 92 L 71 84" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Title & Subtitle -->
    <g transform="translate(115, 0)">
      <!-- Category Badge -->
      <rect x="0" y="8" width="168" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
      <text x="12" y="24" class="font-mono" font-size="11" font-weight="600" fill="#34d399" letter-spacing="1">DETERMINISTIC TEST RUNNER</text>

      <!-- Main Logo Text -->
      <text x="0" y="78" class="font-sans" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">
        Skill<tspan fill="#34d399">Guard</tspan>
      </text>

      <!-- Tagline -->
      <text x="0" y="112" class="font-sans" font-size="17" font-weight="400" fill="#94a3b8">
        Fast, zero-LLM contract &amp; mock assertion testing for Agent Skills and MCP Tools.
      </text>

      <!-- Pill Specs Matrix -->
      <g transform="translate(0, 142)">
        <!-- Pill 1: No LLM -->
        <g transform="translate(0, 0)">
          <rect width="112" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <circle cx="14" cy="15" r="4" fill="#10b981" />
          <text x="26" y="20" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">0 LLM Spend</text>
        </g>
        <!-- Pill 2: Sub-second -->
        <g transform="translate(122, 0)">
          <rect width="112" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <circle cx="14" cy="15" r="4" fill="#38bdf8" />
          <text x="26" y="20" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">&lt; 1s Execution</text>
        </g>
        <!-- Pill 3: Deterministic -->
        <g transform="translate(244, 0)">
          <rect width="126" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <circle cx="14" cy="15" r="4" fill="#a855f7" />
          <text x="26" y="20" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">Byte-Identical Diff</text>
        </g>
        <!-- Pill 4: Secret Redaction -->
        <g transform="translate(380, 0)">
          <rect width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <circle cx="14" cy="15" r="4" fill="#f59e0b" />
          <text x="26" y="20" class="font-sans" font-size="12" font-weight="600" fill="#e2e8f0">Auto-Redaction</text>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT: Terminal UI Mockup Preview -->
  <g transform="translate(680, 40)">
    <!-- Terminal Window Container -->
    <rect width="470" height="280" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

    <!-- Terminal Window Titlebar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 460 0 C 465.523 0 470 4.477 470 10 L 470 36 L 0 36 Z" fill="#0f172a" />
    <line x1="0" y1="36" x2="470" y2="36" stroke="#1e293b" stroke-width="1" />

    <!-- Window Control Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.85" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.85" />
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.85" />

    <text x="235" y="23" text-anchor="middle" class="font-mono" font-size="11" fill="#64748b">skillguard test fixtures/pass</text>

    <!-- Terminal Screen Content -->
    <g transform="translate(20, 58)" class="font-mono" font-size="11.5">
      <!-- Command prompt -->
      <text x="0" y="0" fill="#64748b">$ <tspan fill="#f8fafc">skillguard test</tspan> <tspan fill="#38bdf8">fixtures/pass</tspan></text>
      
      <!-- Banner output -->
      <text x="0" y="22" fill="#64748b">SkillGuard 0.1.0</text>
      
      <!-- Pass line 1 -->
      <g transform="translate(0, 44)">
        <rect width="42" height="18" rx="3" fill="#10b981" fill-opacity="0.2" />
        <text x="6" y="13" font-weight="700" fill="#34d399">PASS</text>
        <text x="48" y="13" fill="#cbd5e1">fixtures/pass/basic.skillguard.json</text>
      </g>
      <text x="14" y="78" fill="#64748b">✔ calls weather with expected city and units</text>

      <!-- Pass line 2 -->
      <g transform="translate(0, 98)">
        <rect width="42" height="18" rx="3" fill="#10b981" fill-opacity="0.2" />
        <text x="6" y="13" font-weight="700" fill="#34d399">PASS</text>
        <text x="48" y="13" fill="#cbd5e1">fixtures/pass/edge.skillguard.json</text>
      </g>
      <text x="14" y="132" fill="#64748b">✔ subset args with extra recorded calls</text>

      <!-- Pass line 3 -->
      <g transform="translate(0, 150)">
        <rect width="42" height="18" rx="3" fill="#10b981" fill-opacity="0.2" />
        <text x="6" y="13" font-weight="700" fill="#34d399">PASS</text>
        <text x="48" y="13" fill="#cbd5e1">fixtures/pass/redaction.skillguard.json</text>
      </g>

      <!-- Status Footer -->
      <line x1="0" y1="180" x2="430" y2="180" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="200" fill="#94a3b8">Summary: 3 fixture(s), 5 passed, 0 failed</text>
      <text x="360" y="200" font-weight="700" fill="#34d399">PASS [0]</text>
    </g>
  </g>
</svg>
